<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <linearGradient id="stormSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="800" fill="url(#stormSky)"/>
  <!-- Expressive Gestural Knife Marks -->
  <g opacity="0.85">
    <polygon points="120,200 450,150 480,240 140,290" fill="#FFC700" opacity="0.9"/>
    <polygon points="350,180 820,120 780,250 320,280" fill="#0284C7" opacity="0.7"/>
    <polygon points="80,320 920,290 890,440 60,460" fill="#0F172A"/>
    <polygon points="180,420 620,400 580,510 150,540" fill="#F8FAFC" opacity="0.8"/>
    <polygon points="450,470 950,440 920,580 430,600" fill="#EAB308" opacity="0.85"/>
  </g>
  <!-- Arabian Sea Squall Waves -->
  <path d="M0 580 Q250 540 500 590 T1000 570 L1000 800 L0 800 Z" fill="#0C1B2A"/>
  <path d="M0 640 Q250 600 500 650 T1000 630 L1000 800 L0 800 Z" fill="#082F49"/>
  <!-- Rain Texture & Splatters -->
  <g stroke="#E2E8F0" stroke-width="2" opacity="0.4" stroke-dasharray="8,20">
    <line x1="100" y1="0" x2="50" y2="700"/>
    <line x1="250" y1="0" x2="200" y2="700"/>
    <line x1="450" y1="0" x2="400" y2="700"/>
    <line x1="650" y1="0" x2="600" y2="700"/>
    <line x1="850" y1="0" x2="800" y2="700"/>
  </g>
  <!-- Clifton Pier / Harbor beacon light -->
  <circle cx="820" cy="380" r="18" fill="#FF0055"/>
  <circle cx="820" cy="380" r="40" fill="#FF0055" opacity="0.2"/>
  <text x="500" y="730" font-family="'Cormorant Garamond', serif" font-size="28" fill="#F8FAFC" text-anchor="middle" letter-spacing="6">MONSOON OVER CLIFTON</text>
  <text x="500" y="760" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle" letter-spacing="3">ALI RAZA ? KARACHI COASTAL SERIES</text>
</svg>