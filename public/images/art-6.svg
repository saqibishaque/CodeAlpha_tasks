<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="woolBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#3A1215"/>
      <stop offset="60%" stop-color="#240A0C"/>
      <stop offset="100%" stop-color="#120405"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#woolBg)"/>
  <!-- Raw Wool Textural Cross-Hatching -->
  <g stroke="#991B1B" stroke-width="1.5" opacity="0.3">
    <line x1="50" y1="100" x2="750" y2="100"/>
    <line x1="50" y1="200" x2="750" y2="200"/>
    <line x1="50" y1="300" x2="750" y2="300"/>
    <line x1="50" y1="400" x2="750" y2="400"/>
    <line x1="50" y1="500" x2="750" y2="500"/>
    <line x1="50" y1="600" x2="750" y2="600"/>
    <line x1="50" y1="700" x2="750" y2="700"/>
    <line x1="50" y1="800" x2="750" y2="800"/>
  </g>
  <!-- Tribal Geometric Swati Embroidery Rhombus Grid -->
  <g fill="none" stroke-width="6">
    <polygon points="400,200 550,350 400,500 250,350" stroke="#F59E0B" fill="#781D22"/>
    <polygon points="400,240 510,350 400,460 290,350" stroke="#10B981" fill="#881337"/>
    <polygon points="400,280 470,350 400,420 330,350" stroke="#F8FAFC" fill="#D97706"/>
    
    <polygon points="400,480 550,630 400,780 250,630" stroke="#F59E0B" fill="#781D22"/>
    <polygon points="400,520 510,630 400,740 290,630" stroke="#10B981" fill="#881337"/>
    <polygon points="400,560 470,630 400,700 330,630" stroke="#F8FAFC" fill="#D97706"/>
  </g>
  <!-- Silver Vintage Amulet Pendants (Chandi Ka Taweez) -->
  <polygon points="400,320 420,350 400,380 380,350" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="400,600 420,630 400,660 380,630" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <!-- Fringe Tassels -->
  <g stroke="#F59E0B" stroke-width="4">
    <line x1="260" y1="840" x2="260" y2="900"/>
    <line x1="330" y1="840" x2="330" y2="900"/>
    <line x1="400" y1="840" x2="400" y2="910"/>
    <line x1="470" y1="840" x2="470" y2="900"/>
    <line x1="540" y1="840" x2="540" y2="900"/>
  </g>
  <text x="400" y="945" font-family="'Cormorant Garamond', serif" font-size="24" fill="#F8FAFC" text-anchor="middle" letter-spacing="4">THE WEFT OF SWAT</text>
  <text x="400" y="975" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle" letter-spacing="2">ZOHRA BIBI ? HINDU KUSH WEAVING CIRCLE</text>
</svg>