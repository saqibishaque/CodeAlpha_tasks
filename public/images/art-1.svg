<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="wasliBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#F7EED9"/>
      <stop offset="70%" stop-color="#EADBBA"/>
      <stop offset="100%" stop-color="#D4BF95"/>
    </radialGradient>
    <linearGradient id="goldArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <pattern id="mughalPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="#C4A877" stroke-width="1.2" opacity="0.35"/>
      <circle cx="20" cy="20" r="4" fill="#AA771C" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#wasliBg)"/>
  <!-- Ornate Miniature Border -->
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#2B1D0C" stroke-width="3"/>
  <rect x="55" y="55" width="690" height="890" fill="url(#mughalPattern)"/>
  <rect x="75" y="75" width="650" height="850" fill="#FDFBF7" stroke="#AA771C" stroke-width="2"/>
  <!-- Arch Silhouette -->
  <path d="M120 780 L120 420 Q120 220 400 150 Q680 220 680 420 L680 780 Z" fill="#1C1814" opacity="0.95"/>
  <path d="M140 760 L140 430 Q140 250 400 180 Q660 250 660 430 L660 760 Z" fill="none" stroke="url(#goldArch)" stroke-width="6"/>
  <!-- Lahore Walled City Architectural Layers -->
  <g fill="#D4AF37" opacity="0.9">
    <rect x="220" y="520" width="70" height="240" fill="#8B261D"/>
    <rect x="310" y="460" width="90" height="300" fill="#5C1A14"/>
    <rect x="420" y="490" width="80" height="270" fill="#9E3A2F"/>
    <rect x="520" y="550" width="60" height="210" fill="#782319"/>
    <!-- Jharoka Balconies -->
    <path d="M210 580 L300 580 L290 610 L220 610 Z" fill="#FFC700"/>
    <path d="M410 540 L510 540 L500 570 L420 570 Z" fill="#FFC700"/>
  </g>
  <!-- Wire lines & Modern intervention -->
  <path d="M100 350 Q400 480 700 320" stroke="#00E5FF" stroke-width="2" fill="none" opacity="0.75"/>
  <path d="M100 380 Q400 520 700 360" stroke="#FFC700" stroke-width="1.8" fill="none"/>
  <path d="M100 410 Q400 560 700 390" stroke="#FF3366" stroke-width="1.5" fill="none" opacity="0.8"/>
  <!-- Gold leaf celestial circle -->
  <circle cx="400" cy="300" r="70" fill="url(#goldArch)"/>
  <circle cx="400" cy="300" r="50" fill="#FBFBFB" opacity="0.15"/>
  <!-- Calligraphic seal -->
  <circle cx="620" cy="720" r="28" fill="#8B261D"/>
  <text x="620" y="726" font-family="serif" font-size="16" fill="#FDFBF7" text-anchor="middle" font-weight="bold">????</text>
  <text x="400" y="860" font-family="serif" font-size="20" fill="#2B1D0C" text-anchor="middle" letter-spacing="4">SHAHZIA REHMAN ? LAHORE</text>
</svg>